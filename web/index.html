<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Piano & Harmony Recognizer</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #222222;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    #clear-all-btn,
    #load-track-btn {
      background-color: #e0e0e0;
      color: #222222;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }

    #clear-all-btn:hover,
    #load-track-btn:hover:not(:disabled) {
      background-color: #d0d0d0;
    }

    #clear-all-btn:active,
    #load-track-btn:active:not(:disabled) {
      background-color: #c0c0c0;
    }

    #load-track-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Sound Mode Selector */
    .sound-mode-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f5f5f5;
      border: 1px solid #dddddd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 500;
    }

    .sound-mode-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .sound-mode-option input[type="radio"] {
      accent-color: #d32f2f;
      cursor: pointer;
    }

    /* Playback Control Bar */
    #playback-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    #play-pause-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background-color: #d32f2f;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
      user-select: none;
    }

    #play-pause-btn:hover:not(:disabled) {
      background-color: #b71c1c;
    }

    #play-pause-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    #play-pause-btn:disabled {
      background-color: #bdbdbd;
      color: #f5f5f5;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .time-label {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #444444;
      min-width: 38px;
      text-align: center;
      user-select: none;
    }

    #seek-slider {
      flex: 1;
      height: 6px;
      accent-color: #d32f2f;
      cursor: pointer;
    }

    #seek-slider:disabled {
      accent-color: #bdbdbd;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Main Workspace */
    .main-workspace {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    /* Piano Container */
    #piano-container {
      position: relative;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #d0d0d0;
      padding: 12px;
      background: #fafafa;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .piano-track {
      display: flex;
      position: relative;
      width: 100%;
      height: 180px;
      user-select: none;
    }

    .white-key {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      background: #ffffff;
      border: 1px solid #bdbdbd;
      border-radius: 0 0 5px 5px;
      position: relative;
      z-index: 1;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      font-size: 11px;
      color: #666666;
      font-weight: 500;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .black-key {
      position: absolute;
      top: 0;
      height: 60%;
      background: #1e1e1e;
      border: 1px solid #111111;
      border-radius: 0 0 4px 4px;
      z-index: 2;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    /* Active Highlight States for Keys */
    .white-key.active {
      background: #e53935;
      border-color: #c62828;
      color: #ffffff;
    }

    .black-key.active {
      background: #ff5252;
      border: 1px solid #ffffff;
      box-shadow: 0 3px 6px rgba(229, 57, 53, 0.5);
    }

    /* Bottom Two-Column Split Row */
    .bottom-split-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 24px;
      align-items: stretch;
      width: 100%;
    }

    /* Section / Panel Headers */
    .panel-header {
      font-size: 15px;
      font-weight: 600;
      color: #444444;
      margin-bottom: 12px;
    }

    /* Left Panel: Intervals */
    #intervals-container {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .intervals-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      flex-grow: 1;
      grid-auto-rows: 1fr;
    }

    /* Right Panel: Chords Section */
    #chords-section {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #chord-type-controls:empty {
      display: none;
    }

    #chord-type-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #chord-type-controls button,
    #chord-type-controls .chord-type-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #cccccc;
      background: #ffffff;
      color: #444444;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s ease;
      user-select: none;
    }

    #chord-type-controls button:hover,
    #chord-type-controls .chord-type-btn:hover {
      background: #f0f0f0;
      border-color: #bbbbbb;
    }

    #chord-type-controls button.active,
    #chord-type-controls .chord-type-btn.active {
      background: #d32f2f;
      color: #ffffff;
      border-color: #b71c1c;
    }

    #chords-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
    }

    .chord-group {
      display: flex;
      flex-direction: column;
      flex: 1 1 160px;
    }

    .chord-group-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(56px, 1fr));
      gap: 10px;
    }

    /* Common Matrix Button Styles */
    .matrix-btn {
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #ffffff;
      border: 2px solid #d32f2f;
      color: #222222;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
      user-select: none;
    }

    .matrix-btn:hover {
      background-color: #ffebee;
    }

    .matrix-btn:active {
      transform: scale(0.97);
    }

    /* Active Highlight State for Matrix Buttons */
    .matrix-btn.active {
      background-color: #d32f2f;
      color: #ffffff;
      border-color: #b71c1c;
      box-shadow: 0 2px 6px rgba(211, 47, 47, 0.35);
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <!-- Top Bar -->
    <header class="top-bar">
      <button id="clear-all-btn" type="button">Clear All</button>
      <div class="sound-mode-group" role="radiogroup" aria-label="Sound Mode">
        <label class="sound-mode-option">
          <input type="radio" name="sound-mode" id="mode-piano" value="piano" checked>
          <span>Piano (Percussive)</span>
        </label>
        <label class="sound-mode-option">
          <input type="radio" name="sound-mode" id="mode-continuous" value="continuous">
          <span>Continuous (Organ)</span>
        </label>
      </div>
      <button id="load-track-btn" type="button">Load Track</button>
    </header>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Piano Container -->
      <section id="piano-container"></section>

      <!-- Playback Controls -->
      <section id="playback-controls" aria-label="Playback Controls">
        <button id="play-pause-btn" type="button" disabled aria-label="Play">&#9654;</button>
        <span id="current-time" class="time-label">0:00</span>
        <input type="range" id="seek-slider" min="0" max="100" step="0.01" value="0" disabled>
        <span id="total-duration" class="time-label">0:00</span>
      </section>

      <!-- Bottom Two-Column Split Row -->
      <section class="bottom-split-row">
        <!-- Left Panel: Intervals -->
        <div id="intervals-container"></div>

        <!-- Right Panel: Chords Section -->
        <div id="chords-section">
          <div id="chord-type-controls"></div>
          <div id="chords-container"></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    // Global Element Lookup Maps (DOM Cache)
    const keyElements = {};        // keyElements[pitch] = el
    const intervalElements = {};   // intervalElements[distance] = el
    const chordElements = {};      // chordElements[`${root}_${chordType}`] = el

    // Current state cache
    let currentState = {
      keyboard: [],
      chords: [],
      intervals: [],
      player: { isPlaying: false, currentTime: 0, totalDuration: 0 }
    };

    // Player & Audio Engine State
    let isDraggingSeek = false;
    let audioCtx = null;
    const activeVoices = new Map(); // pitch -> { osc1, osc2, gain }
    let previousPitches = new Set();
    let wasPlaying = false;

    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioCtx = new AudioCtx();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function midiToFreq(pitch) {
      return 440 * Math.pow(2, (pitch - 69) / 12);
    }

    function getSoundMode() {
      const checked = document.querySelector('input[name="sound-mode"]:checked');
      return checked ? checked.value : "piano";
    }

    function triggerPianoVoice(pitch) {
      ensureAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const freq = midiToFreq(pitch);

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(freq, now);

      osc2.type = "sine";
      osc2.frequency.setValueAtTime(freq * 2, now);

      const osc2Gain = audioCtx.createGain();
      osc2Gain.gain.setValueAtTime(0.25, now);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(8000, freq * 6), now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(400, freq * 1.5), now + 0.8);

      // Higher pitches decay faster, lower pitches sustain slightly longer
      const normalized = Math.max(0, Math.min(1, (pitch - 21) / 87));
      const decayTime = 2.4 - normalized * 1.2;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.22, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + decayTime);

      osc1.connect(filter);
      osc2.connect(osc2Gain);
      osc2Gain.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + decayTime + 0.05);
      osc2.stop(now + decayTime + 0.05);

      osc1.onended = () => {
        osc1.disconnect();
        osc2.disconnect();
        osc2Gain.disconnect();
        filter.disconnect();
        gain.disconnect();
      };
    }

    function startContinuousVoice(pitch) {
      if (activeVoices.has(pitch)) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const freq = midiToFreq(pitch);

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const osc2Gain = audioCtx.createGain();
      const gain = audioCtx.createGain();

      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(freq, now);

      osc2.type = "sine";
      osc2.frequency.setValueAtTime(freq, now);
      osc2Gain.gain.setValueAtTime(0.5, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.14, now + 0.015);

      osc1.connect(gain);
      osc2.connect(osc2Gain);
      osc2Gain.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);

      activeVoices.set(pitch, { osc1, osc2, osc2Gain, gain });
    }

    function stopContinuousVoice(pitch) {
      const voice = activeVoices.get(pitch);
      if (!voice || !audioCtx) return;

      activeVoices.delete(pitch);
      const now = audioCtx.currentTime;
      const { osc1, osc2, osc2Gain, gain } = voice;

      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
      gain.gain.linearRampToValueAtTime(0.0001, now + 0.03);

      osc1.stop(now + 0.04);
      osc2.stop(now + 0.04);
      osc1.onended = () => {
        osc1.disconnect();
        osc2.disconnect();
        osc2Gain.disconnect();
        gain.disconnect();
      };
    }

    function stopAllVoices() {
      for (const pitch of [...activeVoices.keys()]) {
        stopContinuousVoice(pitch);
      }
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "0:00";
      const totalSeconds = Math.floor(sec);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    // Sequential request queue to prevent race conditions
    let requestQueue = Promise.resolve();

    function sendRequest(endpoint, params, isManualAction = false) {
      requestQueue = requestQueue.then(async () => {
        try {
          const query = params ? `?${params.toString()}` : "";
          const res = await fetch(`${endpoint}${query}`, { method: "POST" });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status} on ${endpoint}`);
          }
          const state = await res.json();
          renderState(state, isManualAction);
          return state;
        } catch (err) {
          console.error(`Request failed (${endpoint}):`, err);
          throw err;
        }
      });
      return requestQueue;
    }

    // State Rendering Engine
    function renderState(state, isManualAction = false) {
      if (!state) return;
      currentState = state;

      // 1. Reset: remove .active across all cached elements
      for (const el of Object.values(keyElements)) {
        el.classList.remove("active");
      }
      for (const el of Object.values(intervalElements)) {
        el.classList.remove("active");
      }
      for (const el of Object.values(chordElements)) {
        el.classList.remove("active");
      }

      // 2. Highlight active piano keys
      if (Array.isArray(state.keyboard)) {
        for (const pitch of state.keyboard) {
          keyElements[pitch]?.classList.add("active");
        }
      }

      // 3. Highlight active chords
      if (Array.isArray(state.chords)) {
        for (const chord of state.chords) {
          chordElements[`${chord.rootNote}_${chord.chordType}`]?.classList.add("active");
        }
      }

      // 4. Highlight active intervals
      if (Array.isArray(state.intervals)) {
        for (const interval of state.intervals) {
          intervalElements[interval.distance]?.classList.add("active");
        }
      }

      // 5. Update Player Controls
      const player = state.player || { isPlaying: false, currentTime: 0, totalDuration: 0 };
      const playPauseBtn = document.getElementById("play-pause-btn");
      const seekSlider = document.getElementById("seek-slider");
      const currentTimeEl = document.getElementById("current-time");
      const totalDurationEl = document.getElementById("total-duration");

      const hasTrack = player.totalDuration > 0;
      const isPlaying = Boolean(player.isPlaying);

      if (playPauseBtn) {
        playPauseBtn.disabled = !hasTrack;
        playPauseBtn.innerHTML = (hasTrack && isPlaying) ? "&#9208;" : "&#9654;";
        playPauseBtn.setAttribute("aria-label", (hasTrack && isPlaying) ? "Pause" : "Play");
      }

      if (seekSlider) {
        seekSlider.disabled = !hasTrack;
        if (!isDraggingSeek) {
          seekSlider.max = hasTrack ? String(player.totalDuration) : "100";
          seekSlider.value = hasTrack ? String(player.currentTime) : "0";
          if (currentTimeEl) {
            currentTimeEl.textContent = formatTime(hasTrack ? player.currentTime : 0);
          }
          if (totalDurationEl) {
            totalDurationEl.textContent = formatTime(hasTrack ? player.totalDuration : 0);
          }
        }
      }

      // 6. Edge-Triggered Audio Sync
      const currentPitches = new Set(Array.isArray(state.keyboard) ? state.keyboard : []);

      // Muting on actual pause transition only (not on idle SSE ticks while paused)
      if (wasPlaying && !isPlaying) {
        stopAllVoices();
        previousPitches.clear();
      }
      wasPlaying = isPlaying;

      if (isPlaying || isManualAction) {
        const mode = getSoundMode();
        const added = [...currentPitches].filter((p) => !previousPitches.has(p));
        const removed = [...previousPitches].filter((p) => !currentPitches.has(p));

        for (const pitch of added) {
          if (mode === "piano") {
            triggerPianoVoice(pitch);
          } else {
            startContinuousVoice(pitch);
          }
        }

        for (const pitch of removed) {
          if (mode === "continuous") {
            stopContinuousVoice(pitch);
          }
        }

        previousPitches = currentPitches;
      }
    }

    // Event Delegation Handler
    function handleContainerClick(event) {
      const target = event.target.closest("[data-type]");
      if (!target) return;

      ensureAudioContext();
      const isActive = target.classList.contains("active");
      const endpoint = isActive ? "/release" : "/press";
      const params = new URLSearchParams(target.dataset);

      sendRequest(endpoint, params, true).catch(() => {});
    }

    // Clear All Implementation
    function setupClearAll() {
      const clearBtn = document.getElementById("clear-all-btn");
      if (!clearBtn) return;

      clearBtn.addEventListener("click", () => {
        ensureAudioContext();
        requestQueue = requestQueue.then(async () => {
          const activePitches = [...(currentState.keyboard || [])];
          if (activePitches.length === 0) return;

          let latestState = currentState;
          for (const pitch of activePitches) {
            try {
              const params = new URLSearchParams({ type: "note", pitch: String(pitch) });
              const res = await fetch(`/release?${params.toString()}`, { method: "POST" });
              if (res.ok) {
                latestState = await res.json();
              }
            } catch (err) {
              console.error(`Failed to release pitch ${pitch}:`, err);
            }
          }
          renderState(latestState, true);
        });
      });
    }

    // Playback, Seek, Load Track & Sound Mode Controls
    function setupPlayerControls() {
      const playPauseBtn = document.getElementById("play-pause-btn");
      const seekSlider = document.getElementById("seek-slider");
      const currentTimeEl = document.getElementById("current-time");
      const loadBtn = document.getElementById("load-track-btn");
      const modeRadios = document.querySelectorAll('input[name="sound-mode"]');

      if (playPauseBtn) {
        playPauseBtn.addEventListener("click", () => {
          ensureAudioContext();
          if (currentState.player && currentState.player.isPlaying) {
            stopAllVoices();
            previousPitches.clear();
            sendRequest("/pause", null, false).catch(() => {});
          } else {
            sendRequest("/play", null, false).catch(() => {});
          }
        });
      }

      if (seekSlider) {
        seekSlider.addEventListener("input", () => {
          isDraggingSeek = true;
          if (currentTimeEl) {
            currentTimeEl.textContent = formatTime(parseFloat(seekSlider.value));
          }
        });

        seekSlider.addEventListener("change", () => {
          ensureAudioContext();
          const targetTime = parseFloat(seekSlider.value);
          stopAllVoices();
          previousPitches.clear();
          sendRequest("/seek", new URLSearchParams({ time: String(targetTime) }), false)
            .catch(() => {})
            .finally(() => {
              isDraggingSeek = false;
            });
        });
      }

      if (loadBtn) {
        loadBtn.addEventListener("click", async () => {
          ensureAudioContext();
          const filePath = window.prompt("Enter audio file path (server-relative):", "test.mp3");
          if (filePath === null || filePath.trim() === "") return;

          loadBtn.disabled = true;
          loadBtn.textContent = "Loading...";
          try {
            stopAllVoices();
            previousPitches.clear();
            await sendRequest("/load", new URLSearchParams({ file: filePath.trim() }), false);
          } catch (err) {
            console.error("Failed to load track:", err);
          } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = "Load Track";
          }
        });
      }

      for (const radio of modeRadios) {
        radio.addEventListener("change", () => {
          ensureAudioContext();
          stopAllVoices();
          previousPitches.clear();
        });
      }
    }

    // Piano Keyboard Builder
    function renderKeyboard(keyboardData) {
      const container = document.getElementById("piano-container");
      if (!container) return;
      container.innerHTML = "";

      const track = document.createElement("div");
      track.className = "piano-track";

      const isBlack = (p) => [1, 3, 6, 8, 10].includes(p % 12);
      const minPitch = keyboardData.minPitch;
      const maxPitch = keyboardData.maxPitch;

      const whiteKeys = [];
      const blackKeys = [];

      // Pass 1: Render White Keys
      for (let pitch = minPitch; pitch <= maxPitch; pitch++) {
        if (!isBlack(pitch)) {
          const keyEl = document.createElement("div");
          keyEl.className = "white-key";

          // C notes octave label
          if (pitch % 12 === 0) {
            const octave = Math.floor(pitch / 12) - 1;
            keyEl.textContent = `C${octave}`;
          }

          keyEl.dataset.type = "note";
          keyEl.dataset.pitch = String(pitch);

          track.appendChild(keyEl);
          keyElements[pitch] = keyEl;
          whiteKeys.push({ pitch, el: keyEl, index: whiteKeys.length });
        } else {
          // Preceding white key is the one rendered just before this black key
          blackKeys.push({ pitch, precedingWhiteIndex: whiteKeys.length - 1 });
        }
      }

      // Pass 2: Render Black Keys positioned over preceding white keys
      const whiteCount = whiteKeys.length;
      if (whiteCount > 0) {
        const whiteWidth = 100 / whiteCount;
        const blackWidth = whiteWidth * 0.6;

        for (const item of blackKeys) {
          const keyEl = document.createElement("div");
          keyEl.className = "black-key";

          const left = (item.precedingWhiteIndex + 1) * whiteWidth - (blackWidth / 2);
          keyEl.style.left = `${left}%`;
          keyEl.style.width = `${blackWidth}%`;

          keyEl.dataset.type = "note";
          keyEl.dataset.pitch = String(item.pitch);

          track.appendChild(keyEl);
          keyElements[item.pitch] = keyEl;
        }
      }

      container.appendChild(track);
    }

    // Intervals Matrix Builder
    function renderIntervals(intervalsData) {
      const container = document.getElementById("intervals-container");
      if (!container) return;
      container.innerHTML = "";

      const header = document.createElement("h3");
      header.className = "panel-header";
      header.textContent = "Intervals";
      container.appendChild(header);

      const grid = document.createElement("div");
      grid.className = "intervals-grid";

      const INTERVAL_LABELS = {
        0: "P1", 1: "m2", 2: "M2", 3: "m3", 4: "M3", 5: "P4",
        6: "TT", 7: "P5", 8: "m6", 9: "M6", 10: "m7", 11: "M7"
      };

      for (const item of intervalsData.availableIntervals) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "matrix-btn";
        btn.textContent = INTERVAL_LABELS[item.distance] ?? item.intervalType;

        btn.dataset.type = "interval";
        btn.dataset.distance = String(item.distance);
        btn.dataset.intervalType = item.intervalType;

        grid.appendChild(btn);
        intervalElements[item.distance] = btn;
      }

      container.appendChild(grid);
    }

    // Chords Matrix Builder
    function renderChords(chordsData) {
      const container = document.getElementById("chords-container");
      if (!container) return;
      container.innerHTML = "";

      const ROOT_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      function formatChordLabel(root, chordType) {
        const rootName = ROOT_NAMES[root];
        if (chordType === "major") return rootName;
        if (chordType === "minor") return `${rootName}m`;
        if (chordType === "diminished") return `${rootName}dim`;
        if (chordType === "augmented") return `${rootName}aug`;
        return `${rootName} (${chordType})`;
      }

      for (const chordType of chordsData.types) {
        const group = document.createElement("div");
        group.className = "chord-group";

        const title = chordType.charAt(0).toUpperCase() + chordType.slice(1);
        const header = document.createElement("h3");
        header.className = "panel-header";
        header.textContent = title;
        group.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "chord-group-grid";

        for (let root = 0; root < 12; root++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "matrix-btn";
          btn.textContent = formatChordLabel(root, chordType);

          btn.dataset.type = "chord";
          btn.dataset.root = String(root);
          btn.dataset.inversion = "0";
          btn.dataset.chordType = chordType;

          grid.appendChild(btn);
          chordElements[`${root}_${chordType}`] = btn;
        }

        group.appendChild(grid);
        container.appendChild(group);
      }
    }

    // Lifecycle: Fetch /init, Render UI, Attach Listeners, Sync State
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/init");
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const data = await res.json();

        if (data.keyboard) {
          renderKeyboard(data.keyboard);
        }
        if (data.intervals && Array.isArray(data.intervals.availableIntervals)) {
          renderIntervals(data.intervals);
        }
        if (data.chords && Array.isArray(data.chords.types)) {
          renderChords(data.chords);
        }

        // Attach event delegation listeners
        document.addEventListener("pointerdown", ensureAudioContext, { once: true });
        document.getElementById("piano-container")?.addEventListener("click", handleContainerClick);
        document.getElementById("intervals-container")?.addEventListener("click", handleContainerClick);
        document.getElementById("chords-container")?.addEventListener("click", handleContainerClick);
        setupClearAll();
        setupPlayerControls();

        // Initial state synchronization
        const stateRes = await fetch("/state");
        if (stateRes.ok) {
          const initialState = await stateRes.json();
          renderState(initialState, false);
        }

        // Connect real-time SSE stream
        const eventSource = new EventSource("/events");
        eventSource.onmessage = (event) => {
          try {
            const state = JSON.parse(event.data);
            renderState(state, false);
          } catch (err) {
            console.error("Failed to parse SSE payload:", err);
          }
        };
        eventSource.onerror = (err) => {
          console.error("SSE connection error:", err);
        };
      } catch (err) {
        console.error("Initialization error:", err);
      }
    });
  </script>
</body>

</html>
